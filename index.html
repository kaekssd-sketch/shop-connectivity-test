<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ທົດສອບການເຂົ້າເວັບໃໝ່</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#eff5f0;color:#183b2a;font:18px system-ui,sans-serif;line-height:1.8}main{max-width:640px;margin:7vh auto;padding:28px;background:white;border:1px solid #d7e3d9;border-radius:16px}h1{font-size:25px;line-height:1.5}button{font:inherit;background:#196c4b;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}output{display:block;white-space:pre-wrap;margin:20px 0;padding:14px;border-radius:8px;background:#edf5ef}.small{font-size:14px;color:#5c7164}</style>
</head><body><main><div class="small">ໜ້າເປົ່າສຳລັບທົດສອບ · 30/10/2026</div><h1>ທົດສອບການເຂົ້າເວັບໃໝ່</h1><p>ຖ້າເຫັນໜ້ານີ້ ໃຫ້ກົດປຸ່ມຂ້າງລຸ່ມ ເພື່ອກວດການໂຫຼດຈາກໂຮສຕິ້ງອີກຄັ້ງ.</p><button id="test">ກວດການເຊື່ອມຕໍ່</button><output id="result" aria-live="polite">ລໍກົດປຸ່ມທົດສອບ</output><p>ລອງຜ່ານ Wi-Fi ແລະເນັດມືຖື ແລ້ວບອກວ່າເຂົ້າໄດ້ຫຼືບໍ່.</p><p class="small">ໜ້ານີ້ບໍ່ມີຂໍ້ມູນລູກຄ້າ, ບໍ່ມີລະບົບຮ້ານ ແລະບໍ່ເຊື່ອມກັບເວັບເກົ່າ.</p></main>
<script>document.getElementById('test').onclick=async()=>{const b=document.getElementById('test'),o=document.getElementById('result');b.disabled=true;o.textContent='ກຳລັງກວດ…';const start=performance.now();try{const r=await fetch('./ping.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json();if(p.version!=='empty-host-test-1')throw Error('Unexpected response');o.textContent='✓ ເຊື່ອມຕໍ່ສຳເລັດ\n'+location.hostname+'\n'+Math.round(performance.now()-start)+' ms\n'+new Date().toLocaleString('en-GB',{timeZone:'Asia/Saigon'})+' (UTC+7)'}catch(e){o.textContent='ໂຫຼດບໍ່ສຳເລັດ · '+e.message+'\nກະລຸນາລອງອີກຄັ້ງ'}finally{b.disabled=false}};</script></body></html>
